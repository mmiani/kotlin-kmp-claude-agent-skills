name: Claude PR Fix

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # secrets are not readable from a job-level `if`, so surface it as an env
    # value the fix step can gate on. A repository that has not set the key
    # reports that instead of failing after the commenter asked for a fix.
    env:
      HAS_ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    # Only run when a trusted maintainer comments "@claude fix" on a PR.
    # This job has write access and pushes commits, so an untrusted commenter
    # must never be able to trigger it.
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude fix') &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Report skipped fix
        if: env.HAS_ANTHROPIC_KEY != 'true'
        run: echo "ANTHROPIC_API_KEY is not set for this repository; skipping the Claude fix." >> "$GITHUB_STEP_SUMMARY"

      - uses: anthropics/claude-code-action@v1
        if: env.HAS_ANTHROPIC_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are fixing issues on a pull request for a Kotlin Multiplatform project.

            Steps:
            1. Read the full PR diff against main.
            2. Read all review comments and feedback on this PR.
            3. Identify high-value fixes that are within the PR's scope.
            4. Apply only targeted, minimal fixes.
            5. Do NOT refactor unrelated code or broaden the PR scope.
            6. Do NOT add features beyond what the PR intended.
            7. Preserve architecture and module boundaries.
            8. Ensure KMP source-set correctness.
            9. Commit fixes with clear messages describing what was fixed and why.
            10. Push fixes to the PR branch.

            Constraints:
            - Only fix issues relevant to this PR
            - Prefer root-cause fixes over workarounds
            - Do not weaken security or trust boundaries
            - Keep changes minimal and traceable
            - If a fix would significantly expand scope, leave a comment instead
          claude_args: "--model claude-sonnet-4-6 --max-turns 10"
          additional_permissions: "Bash(./gradlew *),Bash(git status*),Bash(git diff*),Bash(git add*),Bash(git commit*),Bash(git push*),Read(*),Write(*),Edit(*),Glob(*),Grep(*)"
